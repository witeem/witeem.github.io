<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 | Witeem's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #0084FF;
      --color-primary-dark: #0066CC;
      --color-secondary: #00AAFF;
      --bg-body: #ffffff;
      --bg-card: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --border-radius: 12px;
      --border-radius-sm: 6px;
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --transition: 0.2s ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-body: #0f172a;
        --bg-card: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --border-color: #334155;
      }
    }

    [data-theme="dark"] {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border-color: #334155;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      transition: background 0.2s, color 0.2s;
    }

    a { color: var(--color-primary); text-decoration: none; }

    .container {
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .code {
      font-size: 7rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #0084FF, #00AAFF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 0.5rem;
    }

    .illus {
      margin: 1rem auto 1.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p.desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.8;
      margin-bottom: 2rem;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.35rem;
      border-radius: var(--border-radius-sm);
      font-weight: 500;
      font-size: 0.9rem;
      transition: all var(--transition);
      cursor: pointer;
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }
    .btn-primary:hover { background: var(--color-primary-dark); color: white; }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover { border-color: var(--color-primary); color: var(--color-primary); }

    .links-section {
      border-top: 1px solid var(--border-color);
      padding-top: 1.5rem;
    }
    .links-section p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
    }
    .links-section ul {
      list-style: none;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links-section a {
      color: var(--color-primary);
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.25rem 0.75rem;
      border-radius: var(--border-radius-sm);
      border: 1px solid rgba(0,132,255,0.3);
      transition: all var(--transition);
    }
    .links-section a:hover {
      background: rgba(0,132,255,0.08);
      border-color: var(--color-primary);
    }

    .theme-btn {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-sm);
      cursor: pointer;
      padding: 0.4rem;
      display: flex;
      align-items: center;
      color: var(--text-secondary);
      transition: all var(--transition);
      font-size: 1.1rem;
    }
    .theme-btn:hover { color: var(--color-primary); border-color: var(--color-primary); }
  </style>
</head>
<body>
  <button class="theme-btn" id="themeToggle" title="切换主题">🌙</button>

  <div class="container">
    <div class="code">404</div>

    <div class="illus">
      <svg width="160" height="120" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="80" cy="108" rx="60" ry="8" fill="#0084FF" fill-opacity="0.08"/>
        <rect x="30" y="20" width="100" height="72" rx="8" fill="#E8F4FF" stroke="#0084FF" stroke-width="2"/>
        <rect x="38" y="30" width="84" height="10" rx="3" fill="#B3D9FF"/>
        <rect x="38" y="46" width="56" height="8" rx="3" fill="#CCE8FF"/>
        <rect x="38" y="60" width="40" height="8" rx="3" fill="#CCE8FF"/>
        <circle cx="118" cy="28" r="14" fill="#0084FF"/>
        <text x="118" y="33" text-anchor="middle" font-size="16" fill="white" font-weight="bold">?</text>
      </svg>
    </div>

    <h1>页面不存在</h1>
    <p class="desc">
      抱歉，你访问的页面已被删除、移动或从未存在过。<br/>
      请检查链接是否正确，或返回首页继续浏览。
    </p>

    <div class="actions">
      <a href="https://witeem.github.io/" class="btn btn-primary">🏠 返回首页</a>
      <a href="https://witeem.github.io/posts/" class="btn btn-secondary">📝 浏览文章</a>
    </div>

    <div class="links-section">
      <p>你也可以尝试以下页面：</p>
      <ul>
        <li><a href="https://witeem.github.io/posts/">文章列表</a></li>
        <li><a href="https://witeem.github.io/tags/">标签云</a></li>
        <li><a href="https://witeem.github.io/about/">关于我</a></li>
      </ul>
    </div>
  </div>

  <script>
    const html = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    html.setAttribute('data-theme', saved);
    btn.textContent = saved === 'dark' ? '☀️' : '🌙';

    btn.addEventListener('click', () => {
      const cur = html.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      btn.textContent = next === 'dark' ? '☀️' : '🌙';
    });
  </script>
</body>
</html>
