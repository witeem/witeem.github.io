<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <a href="{{ "/" | relURL }}" class="footer-logo">⚡ Witeem's Blog</a>
      <p class="footer-slogan">{{ .Site.Params.slogan }}</p>
    </div>

    <div class="footer-links">
      <div class="footer-col">
        <h4>导航</h4>
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </div>
      <div class="footer-col">
        <h4>联系</h4>
        <a href="https://github.com/witeem" target="_blank" rel="noopener">🐙 GitHub</a>
        <a href="mailto:{{ .Site.Params.email }}">📫 Email</a>
      </div>
      <div class="footer-col">
        <h4>订阅</h4>
        <a href="{{ "/index.xml" | relURL }}">📡 RSS Feed</a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>
      © {{ now.Year }} <a href="https://github.com/witeem">TianHua Wei</a> · 
      Powered by <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a> · 
      Hosted on <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
    </p>
  </div>
</footer>
