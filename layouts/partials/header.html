<header class="site-header">
  <div class="header-inner">
    <a href="{{ "/" | relURL }}" class="site-logo">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">Witeem</span>
    </a>

    <nav class="site-nav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL | absLangURL }}"
         class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
    </nav>

    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="切换主题">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Mobile menu toggle -->
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- Mobile nav -->
  <nav class="mobile-nav" id="mobileNav">
    {{ range .Site.Menus.main }}
    <a href="{{ .URL | absLangURL }}" class="mobile-nav-link">{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
