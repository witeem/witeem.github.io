name: 🚀 Deploy to GitHub Pages

on:
  # 推送到 main 分支时自动触发
  push:
    branches:
      - main

  # 允许手动触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # 允许 configure-pages 自动启用 GitHub Pages

# 同一时间只允许一个部署，不取消正在进行的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

# 默认使用 bash
defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────────────
  # Job 1: 构建
  # ─────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.124.1

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive   # 如果主题是 submodule 则需要
          fetch-depth: 0          # 获取完整历史，用于 .GitInfo

      - name: 🔧 Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true          # 使用 Hugo extended 版本（支持 Sass/SCSS）

      - name: 📦 Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # 如果 Pages 尚未启用，自动开启

      - name: 🏗️ Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://witeem.github.io/"

      - name: ✅ Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ─────────────────────────────────────
  # Job 2: 部署
  # ─────────────────────────────────────
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
