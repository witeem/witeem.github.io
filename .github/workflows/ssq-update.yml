name: 🎱 双色球数据更新

on:
  # 双色球每周二、四、日开奖，次日北京时间 06:00 抓取并更新
  # 北京时间 06:00 = UTC 22:00（前一天）
  # 周三（3）= 周二开奖次日  → UTC 周二 22:00（cron 星期三）
  # 周五（5）= 周四开奖次日  → UTC 周四 22:00（cron 星期五）
  # 周一（1）= 周日开奖次日  → UTC 周日 22:00（cron 星期一）
  schedule:
    - cron: "0 22 * * 0,2,4"

  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write   # 用于 git push 新生成的 MD 文件

concurrency:
  group: "ssq-update"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-ssq:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.124.1

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: pip install requests

      - name: 🎱 Run SSQ predictor script
        run: python scripts/ssq_predictor.py

      - name: 📝 Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ssq/ scripts/ssq_last_prediction.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "🎱 chore: SSQ predictions ${DATE} [auto]"
            git push
          fi
          # push 到 main 后，deploy.yml 会自动触发 Hugo 构建和部署
