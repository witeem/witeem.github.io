name: 🎱 双色球数据更新

on:
  # 每天北京时间 09:00 自动运行（UTC 01:00）
  schedule:
    - cron: "0 1 * * *"

  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "ssq-update"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-ssq:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.124.1

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: pip install requests

      - name: 🎱 Run SSQ predictor script
        run: python scripts/ssq_predictor.py

      - name: 📝 Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ssq/ scripts/ssq_last_prediction.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date +'%Y-%m-%d')
            git commit -m "🎱 chore: SSQ predictions ${DATE} [auto]"
            git push
          fi

      - name: 🔧 Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: 📦 Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 🏗️ Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://witeem.github.io/"

      - name: ✅ Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
